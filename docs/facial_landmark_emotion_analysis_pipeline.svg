<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
.h{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#475569}.bt{font-size:19px;font-weight:700;fill:white}
.body{font-size:16px}.small{font-size:14px;fill:#334155}
.box{fill:#f8fafc;stroke:#1d4ed8;stroke-width:2;rx:18}.head{fill:#0f4c81;rx:16}
.arrow{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<text x="800" y="48" text-anchor="middle" class="h">Facial Landmark and Emotion-Analysis Pipeline</text>
<text x="800" y="78" text-anchor="middle" class="sub">RGB / NoIR acquisition, facial features, dataset generation and future Siamese-CNN learning</text>

<g transform="translate(30,150)"><rect class="box" width="190" height="390"/><rect class="head" width="190" height="58"/><text x="95" y="35" text-anchor="middle" class="bt">MULTIMODAL INPUT</text>
<text x="95" y="105" text-anchor="middle" class="body">RGB IMX219</text><rect x="35" y="125" width="120" height="92" fill="#dbeafe" stroke="#94a3b8"/>
<circle cx="95" cy="160" r="26" fill="#fde68a"/><path d="M67 199 Q95 170 123 199" fill="#bfdbfe"/>
<text x="95" y="262" text-anchor="middle" class="body">NoIR OV5647</text><rect x="35" y="280" width="120" height="80" fill="#e5e7eb" stroke="#94a3b8"/>
<circle cx="95" cy="310" r="23" fill="#cbd5e1"/><path d="M70 345 Q95 320 120 345" fill="#94a3b8"/>
<text x="95" y="382" text-anchor="middle" class="small">Input images</text></g>

<line x1="225" y1="345" x2="270" y2="345" class="arrow"/>

<g transform="translate(280,150)"><rect class="box" width="200" height="390"/><rect class="head" width="200" height="58"/><text x="100" y="25" text-anchor="middle" class="bt">FACE DETECTION +</text><text x="100" y="47" text-anchor="middle" class="bt">MEDIAPIPE</text>
<ellipse cx="100" cy="200" rx="58" ry="78" fill="#fef3c7" stroke="#334155"/><g fill="#2563eb">
<circle cx="145.0" cy="200.0" r="3"/><circle cx="144.2" cy="211.4" r="3"/><circle cx="142.0" cy="222.4" r="3"/><circle cx="138.3" cy="232.6" r="3"/><circle cx="133.3" cy="241.8" r="3"/><circle cx="127.1" cy="249.5" r="3"/><circle cx="120.1" cy="255.5" r="3"/><circle cx="112.3" cy="259.6" r="3"/><circle cx="104.2" cy="261.7" r="3"/><circle cx="95.8" cy="261.7" r="3"/><circle cx="87.7" cy="259.6" r="3"/><circle cx="79.9" cy="255.5" r="3"/><circle cx="72.9" cy="249.5" r="3"/><circle cx="66.7" cy="241.8" r="3"/><circle cx="61.7" cy="232.6" r="3"/><circle cx="58.0" cy="222.4" r="3"/><circle cx="55.8" cy="211.4" r="3"/><circle cx="55.0" cy="200.0" r="3"/><circle cx="55.8" cy="188.6" r="3"/><circle cx="58.0" cy="177.6" r="3"/><circle cx="61.7" cy="167.4" r="3"/><circle cx="66.7" cy="158.2" r="3"/><circle cx="72.9" cy="150.5" r="3"/><circle cx="79.9" cy="144.5" r="3"/><circle cx="87.7" cy="140.4" r="3"/><circle cx="95.8" cy="138.3" r="3"/><circle cx="104.2" cy="138.3" r="3"/><circle cx="112.3" cy="140.4" r="3"/><circle cx="120.1" cy="144.5" r="3"/><circle cx="127.1" cy="150.5" r="3"/><circle cx="133.3" cy="158.2" r="3"/><circle cx="138.3" cy="167.4" r="3"/><circle cx="142.0" cy="177.6" r="3"/><circle cx="144.2" cy="188.6" r="3"/>
</g><text x="100" y="320" text-anchor="middle" class="body">Face Mesh / landmarks</text><text x="100" y="348" text-anchor="middle" class="small">Dense facial tracking</text></g>

<line x1="485" y1="345" x2="530" y2="345" class="arrow"/>

<g transform="translate(540,150)"><rect class="box" width="200" height="390"/><rect class="head" width="200" height="58"/><text x="100" y="25" text-anchor="middle" class="bt">REGIONS OF</text><text x="100" y="47" text-anchor="middle" class="bt">INTEREST</text>
<ellipse cx="100" cy="195" rx="58" ry="78" fill="#fef3c7" stroke="#334155"/><rect x="57" y="145" width="86" height="24" fill="#bfdbfe" opacity=".8"/><rect x="55" y="176" width="90" height="28" fill="#bbf7d0" opacity=".8"/><ellipse cx="100" cy="236" rx="31" ry="13" fill="#fecaca"/>
<text x="100" y="305" text-anchor="middle" class="body">Eyebrows • Eyes • Mouth</text><text x="100" y="332" text-anchor="middle" class="body">Forehead • Lip corners</text></g>

<line x1="745" y1="345" x2="790" y2="345" class="arrow"/>

<g transform="translate(800,150)"><rect class="box" width="235" height="390"/><rect class="head" width="235" height="58"/><text x="117" y="25" text-anchor="middle" class="bt">LANDMARK FEATURES</text><text x="117" y="47" text-anchor="middle" class="bt">&amp; MEASUREMENTS</text>
<path d="M55 160 Q117 120 180 160" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="70" cy="155" r="4" fill="#2563eb"/><circle cx="117" cy="137" r="4" fill="#2563eb"/><circle cx="165" cy="155" r="4" fill="#2563eb"/>
<line x1="70" y1="190" x2="165" y2="190" stroke="#111827" stroke-width="2"/><text x="117" y="182" text-anchor="middle" class="body">d1</text>
<ellipse cx="117" cy="245" rx="48" ry="22" fill="none" stroke="#ef4444" stroke-width="3"/><line x1="117" y1="223" x2="117" y2="267" stroke="#111827" stroke-width="2"/><text x="130" y="248" class="body">d2</text>
<text x="117" y="315" text-anchor="middle" class="small">X,Y coordinates</text><text x="117" y="338" text-anchor="middle" class="small">normalized distances</text></g>

<line x1="1040" y1="345" x2="1085" y2="345" class="arrow"/>

<g transform="translate(1095,150)"><rect class="box" width="190" height="390"/><rect class="head" width="190" height="58"/><text x="95" y="35" text-anchor="middle" class="bt">FEATURE VECTOR</text>
<rect x="28" y="130" width="134" height="90" fill="#dbeafe" rx="12"/><text x="95" y="170" text-anchor="middle" class="body">F = [d1, d2,</text><text x="95" y="198" text-anchor="middle" class="body">d3, d4, ...]</text>
<text x="95" y="280" text-anchor="middle" class="small">Landmark coordinates</text><text x="95" y="305" text-anchor="middle" class="small">+ normalized metrics</text></g>

<line x1="1290" y1="345" x2="1335" y2="345" class="arrow"/>

<g transform="translate(1345,150)"><rect class="box" width="220" height="390"/><rect class="head" width="220" height="58"/><text x="110" y="25" text-anchor="middle" class="bt">DATASET +</text><text x="110" y="47" text-anchor="middle" class="bt">SIAMESE MODEL</text>
<rect x="35" y="105" width="150" height="55" fill="#e0f2fe" rx="10"/><text x="110" y="138" text-anchor="middle" class="body">RGB / NoIR dataset</text>
<line x1="110" y1="160" x2="110" y2="200" class="arrow"/><rect x="45" y="210" width="130" height="55" fill="#ede9fe" rx="10"/><text x="110" y="243" text-anchor="middle" class="body">Siamese CNN</text>
<line x1="110" y1="265" x2="110" y2="305" class="arrow"/><rect x="45" y="315" width="130" height="48" fill="#dcfce7" rx="10"/><text x="110" y="345" text-anchor="middle" class="body">Feature fusion</text></g>

<text x="800" y="620" text-anchor="middle" class="sub">Future output: multimodal emotion classification (e.g., Happy • Sad • Neutral) after validated training</text>
<rect x="140" y="660" width="1320" height="55" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="800" y="694" text-anchor="middle" class="body">Acquisition → Face Mesh → ROI selection → Geometric features → Dataset → Siamese CNN → Multimodal classification</text>
</svg>